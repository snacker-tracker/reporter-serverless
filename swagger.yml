openapi: 3.0.0
info:
  version: 0.0.1
  title: Snacker-Tracker-Reporter
  description: Tracking the snacks at the office
  contact:
    name: Laz Mac
    email: leprechaun@gmail.com
    url: https://github.com/leprechaun
  license:
    name: GNU General Public License v3.0
    url: https://choosealicense.com/licenses/gpl-3.0/

servers:
  - url: /v1

tags:
  - name: scans
    description: >
      Scanning barcodes
  - name: codes
    description: >
      Code management
  - name: stats
    description: >
      Get statistics about scans and codes
  - name: categories
    description: >
      Information about the categories of products in the system
  - name: heartbeat
    description: >
      Liveness pings from scanner devices

x-amazon-apigateway-request-validator: basic
x-amazon-apigateway-request-validators:
  basic:
    validateRequestBody: true
    validateRequestParameters: true

paths:
  /scans:
    post:
      operationId: CreateScan
      description: |
        Create a new scan record for a product code
      tags:
        - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanPayload"
#         application/x-www-form-urlencoded:
#           schema:
#             $ref: "#/components/schemas/CreateScanPayload"
        required: true
      responses:
        "201":
          description: |
            Record a scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Scan"

        "200":
          description: |
            Record a scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Scan"

        "500":
          description: |
            Record a scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Scan"
      security:
        - api_key: []

      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${aws_region}:events:action/PutEvents"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "aws"
        credentials: "${integration_role}"
        requestTemplates:
          application/json: |
            #set($context.requestOverride.header['X-Amz-Target'] = "AWSEvents.PutEvents")
            #set($context.requestOverride.header['Content-Type'] = "application/x-amz-json-1.1")

            #set($data = "{""client_ip"": ""$context.identity.sourceIp"", ""request_id"": ""$context.requestId"", ""payload"": $input.json('$'), ""apiKeyId"": ""$context.identity.apiKeyId""}")
            {
                "Entries": [
                  {
                    "EventBusName": "${eventbus_name}",
                    "Source": "scanner",
                    "DetailType": "scans",
                    "Resources": [],
                    "Detail": "$util.escapeJavaScript($data)"
                  }
                ]
            }

        responses:
          "200":
            statusCode: '200'
            responseTemplates:
              application/json: $input.json('$.Entries[0]')
              application/x-amz-json-1.1: $input.json('$.Entries[0]')

  /heartbeat:
    post:
      operationId: CreateHeartbeat
      description: |
        Record a liveness ping from a scanner device
      tags:
        - heartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHeartbeatPayload"
        required: true
      responses:
        "201":
          description: |
            Record a heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heartbeat"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Heartbeat"

        "200":
          description: |
            Record a heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heartbeat"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Heartbeat"

        "500":
          description: |
            Record a heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heartbeat"
            application/x-amz-json-1.1:
              schema:
                $ref: "#/components/schemas/Heartbeat"
      security:
        - api_key: []

      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${aws_region}:events:action/PutEvents"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "aws"
        credentials: "${integration_role}"
        requestTemplates:
          application/json: |
            #set($context.requestOverride.header['X-Amz-Target'] = "AWSEvents.PutEvents")
            #set($context.requestOverride.header['Content-Type'] = "application/x-amz-json-1.1")

            #set($data = "{""client_ip"": ""$context.identity.sourceIp"", ""request_id"": ""$context.requestId"", ""payload"": $input.json('$'), ""apiKeyId"": ""$context.identity.apiKeyId""}")
            {
                "Entries": [
                  {
                    "EventBusName": "${eventbus_name}",
                    "Source": "scanner",
                    "DetailType": "heartbeats",
                    "Resources": [],
                    "Detail": "$util.escapeJavaScript($data)"
                  }
                ]
            }

        responses:
          "200":
            statusCode: '200'
            responseTemplates:
              application/json: $input.json('$.Entries[0]')
              application/x-amz-json-1.1: $input.json('$.Entries[0]')

components:
  securitySchemes:
    api_key:
      type: "apiKey"
      name: "x-api-key"
      in: "header"

  schemas:
    UPCCode:
      type: string
      format: upc
      description: |
        UPC Code aka barcode

    ScannerLocation:
      type: string
      description: |
        The ID or location of the barcode scanner

    CreateScanPayload:
      description: |
        The payload to append a scan event
      type: object
      additionalProperties: false
      required:
        - code
        - location
      properties:
        code:
          $ref: "#/components/schemas/UPCCode"
        location:
          $ref: "#/components/schemas/ScannerLocation"
        scanned_at:
          type: string
          format: date-time

    ScannedAt:
      type: string
      format: date-time
      description: |
        When the scan event occured, represented in ISO8601

    ScannerDeviceInfo:
      description: |
        Identity of the scanner device sending the heartbeat
      type: object
      additionalProperties: false
      required:
        - name
        - location
      properties:
        id:
          type: string
          description: |
            The hardware serial number of the scanner device
        name:
          type: string
          description: |
            The name/identifier of the scanner device
        location:
          $ref: "#/components/schemas/ScannerLocation"
        board:
          type: string
          description: |
            The model of the microcontroller board the scanner device runs on

    ScannerAppInfo:
      description: |
        The application running on the scanner device
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        name:
          type: string
          description: |
            The name of the application running on the scanner device
        version:
          type: string
          description: |
            The version of the application running on the scanner device

    ScannerPlatformInfo:
      description: |
        The runtime platform the scanner device's application runs on
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            The name of the runtime/firmware platform, e.g. "micropython"
        version:
          type: string
          description: |
            The version of the runtime/firmware platform

    ScannerTelemetry:
      description: |
        Diagnostic data reported by the scanner device
      type: object
      additionalProperties: false
      required:
        - uptime
      properties:
        uptime:
          type: integer
          format: int64
          description: |
            The number of seconds the scanner device has been running since its last restart
        mem_free:
          type: integer
          format: int64
          description: |
            Free heap memory on the device, in bytes
        reset_cause:
          type: string
          description: |
            The reason the device last reset/rebooted
        wifi_ssid:
          type: string
          description: |
            The SSID of the WiFi network the device is connected to
        wifi_rssi:
          type: integer
          format: int32
          description: |
            WiFi signal strength, in dBm

    CreateHeartbeatPayload:
      description: |
        The payload to record a scanner device liveness ping
      type: object
      additionalProperties: false
      required:
        - schema_version
        - device
        - app
        - telemetry
      properties:
        schema_version:
          type: integer
          description: |
            The version of this heartbeat payload's shape
        device:
          $ref: "#/components/schemas/ScannerDeviceInfo"
        app:
          $ref: "#/components/schemas/ScannerAppInfo"
        platform:
          $ref: "#/components/schemas/ScannerPlatformInfo"
        telemetry:
          $ref: "#/components/schemas/ScannerTelemetry"

    Heartbeat:
      description: |
        A recorded scanner device liveness ping
      type: object
      properties:
        schema_version:
          type: integer
        device:
          $ref: "#/components/schemas/ScannerDeviceInfo"
        app:
          $ref: "#/components/schemas/ScannerAppInfo"
        platform:
          $ref: "#/components/schemas/ScannerPlatformInfo"
        telemetry:
          $ref: "#/components/schemas/ScannerTelemetry"
