name: Pipeline

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"

      - name: Check terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Run ruff
        working-directory: functions/append-eventbridge-to-bronze
        run: |
          uv sync --all-groups
          uv run ruff check

      - name: Run tests
        working-directory: functions/append-eventbridge-to-bronze
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda images
        working-directory: functions/append-eventbridge-to-bronze
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: snacker-tracker-lambda/append-to-bronze
          VERSION: ${{ github.run_number }}
        run: |
          docker build --target append-to-bronze -t $REGISTRY/$REPO:$VERSION-append .
          docker build --target rebuild-bronze -t $REGISTRY/$REPO:$VERSION-rebuild .
          docker push $REGISTRY/$REPO:$VERSION-append
          docker push $REGISTRY/$REPO:$VERSION-rebuild

  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - build
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
      - name: Apply
        run: |
          terraform init
          terraform workspace select --or-create dev
          terraform apply --auto-approve --var version_label=${{ github.run_number }} --var domain=reporter-dev.khanom.xyz

  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - deploy-dev
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
      - name: Apply
        run: |
          terraform init
          terraform workspace select --or-create prod
          terraform apply --auto-approve --var version_label=${{ github.run_number }} --var domain=reporter.khanom.xyz
