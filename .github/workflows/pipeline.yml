name: Pipeline

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  id-token: write

env:
  # The version is MAJOR.MINOR.<this workflow's run number>, applied as the provider's Version tag; bump these by hand.
  IMAGE_VERSION_MAJOR: 1
  IMAGE_VERSION_MINOR: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "v1.17.1"

      - name: Check terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - test
    env:
      TF_WORKSPACE: dev
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "v1.17.1"
      - name: Apply
        run: |
          terraform init
          terraform apply --auto-approve --var version_label=${{ env.IMAGE_VERSION_MAJOR }}.${{ env.IMAGE_VERSION_MINOR }}.${{ github.run_number }} --var domain=reporter-dev.khanom.xyz

  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - deploy-dev
    env:
      TF_WORKSPACE: prod
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "v1.17.1"
      - name: Apply
        run: |
          terraform init
          terraform apply --auto-approve --var version_label=${{ env.IMAGE_VERSION_MAJOR }}.${{ env.IMAGE_VERSION_MINOR }}.${{ github.run_number }} --var domain=reporter.khanom.xyz
